name: Modrinth Feature Request
description: File a Modrinth feature request
title: "[Modrinth Feature Request]: "
labels: ["enhancement", "modrinth"]
assignees:
  - GamerSoft24
  - GmaerSoft42
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this Modrinth feature request!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: e.g. email@example.com
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What do you want us to improve?
      description: Write down what feature you want us to add to a mod.
      placeholder: Tell us what feature you want us to add!
    validations:
      required: true
  - type: checkboxes
    id: modrinth_confirm
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you assure that this issue is related to a Modrinth mod made by the [Titan1um x Polr](https://modrinth.com/organization/titan1um-x-polr) organisation.
      options:
        - label: I assure that this issue is related to a Modrinth mod made by the Titan1um x Polr organisation.
          required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this feature request, you agree to follow our [Code of Conduct](https://github.com/GamerSoft24/Software/blob/Main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
